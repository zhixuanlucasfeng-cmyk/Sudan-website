<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restar Solar Sudan has moved to restarsolar.net</title>
<link rel="canonical" href="https://restarsolar.net/?country=SD">
<!-- No-JavaScript fallback. Delayed a second so the script below, which also
     carries the #anchor across, wins whenever scripting is available. -->
<meta http-equiv="refresh" content="1; url=https://restarsolar.net/?country=SD">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;background:#fff;color:#111;
       font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .box{max-width:30rem;text-align:center}
  img{width:180px;max-width:100%;height:auto;margin-bottom:24px}
  a{color:#0B57A4;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <img src="logo.webp" alt="Restar Solar" onerror="this.remove()">
    <p>Restar Solar Sudan is now part of <strong>restarsolar.net</strong>, one site serving
       every country we supply. Sudan is preselected for you.</p>
    <p><a id="go" href="https://restarsolar.net/?country=SD">Continue to restarsolar.net</a></p>
  </div>
<script>
// Keeps any #anchor the visitor arrived with, so old deep links still land in
// the right section of the unified site.
(function () {
  var target = 'https://restarsolar.net/?country=SD' + (location.hash || '');
  var link = document.getElementById('go');
  if (link) { link.href = target; }
  location.replace(target);
})();
</script>
</body>
</html>
